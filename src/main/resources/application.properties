spring.application.name=prod-ready-features

spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?useSSL=false
spring.datasource.username=root
spring.datasource.password=abhi@2203

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=com/codingshuttle/prod_ready_features/dto/**

employeeService.base.url = http://localhost:2007/

#Logging configuration
logging.level.com.codingshuttle.prod_ready_features.clients=TRACE
logging.level.com.codingshuttle.prod_ready_features.config=info
#logging.level.root=trace
logging.pattern.console=%d{dd-mm-yyyy hh:mm:ss}  [%level] %c{1.} --- %m%n
logging.file.name=application.log
logging.config=classpath:logback-spring.xml

#actuator configuration
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.app.author=Abhijit kumar
info.app.version=1.0.0
info.app.documentation=https://codingshuttle.com/docs
management.endpoint.env.show-values=always
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

#open api documentation configuration
springdoc.api-docs.enabled=true

